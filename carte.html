<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Carte de Membre - JSD</title>
    
    <!-- Bootstrap CSS -->
    <link href="lib/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="lib/ionicons/css/ionicons.min.css" rel="stylesheet">
    
    <!-- Bibliothèques JavaScript pour le QR Code et la génération JPG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 50px;
        }

        /* CONFIGURATION STRICTE DES DIMENSIONS DE LA CARTE (9 cm x 6 cm) */
        .carte-container {
            width: 9cm;
            height: 6cm;
            background: #ffffff;
            border: 2px solid #4F84C4;
            border-radius: 8px;
            padding: 0.2cm 0.3cm;
            position: relative;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            overflow: hidden;
            margin: auto;
        }

        /* Logo en haut à gauche */
        .carte-logo {
            position: absolute;
            top: 0.2cm;
            left: 0.2cm;
            width: 1.1cm;
            height: 1.1cm;
            object-fit: contain;
        }

        /* En-tête centré */
        .carte-header {
            text-align: center;
            margin-left: 1cm; /* Laisse la place au logo */
            margin-bottom: 0.1cm;
        }

        .carte-header h6 {
            font-size: 7.5pt;
            font-weight: bold;
            color: #000000;
            margin: 0;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .carte-header h5 {
            font-size: 8pt;
            font-weight: 800;
            color: #4F84C4;
            margin: 1px 0;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .carte-header p {
            font-size: 7pt;
            font-weight: bold;
            color: #000000;
            margin: 0;
            line-height: 1;
        }

        /* Corps de la carte */
        .carte-body {
            display: flex;
            justify-content: space-between;
            margin-top: 0.1cm;
            height: calc(100% - 1.5cm);
        }

        /* Informations à gauche */
        .carte-infos {
            width: 5.8cm;
            font-size: 6.5pt;
            color: #000000;
            line-height: 1.25;
        }

        .carte-infos div {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .carte-infos strong {
            color: #222;
        }

        /* Zone droite : Photo et QR Code */
        .carte-droite {
            width: 2.2cm;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
        }

        /* Photo en haut à droite */
        .carte-photo {
            width: 1.8cm;
            height: 2.1cm;
            border: 1px solid #4F84C4;
            border-radius: 4px;
            object-fit: cover;
            background-color: #e9ecef;
        }

        /* QR Code en bas à droite */
        #qrcode {
            width: 1.5cm;
            height: 1.5cm;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qrcode img {
            width: 1.5cm !important;
            height: 1.5cm !important;
        }

        /* Styles pour l'impression sécurisée */
        @media print {
            body * {
                visibility: hidden !important;
            }
            .is-printing-carte, .is-printing-carte * {
                visibility: visible !important;
            }
            .is-printing-carte {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Barre de Navigation Simple -->
    <div class="bg-dark py-2 text-white mb-4 no-print">
        <div class="container d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold"><i class="icon ion-md-card me-2"></i> Générateur de Carte de Membre JSD</h5>
            <a href="index.html" class="btn btn-sm btn-outline-light">Retour à l'accueil</a>
        </div>
    </div>

    <div class="container">
        <div class="row">
            
            <!-- FORMULAIRE DE SAISIE POUR LE MEMBRE -->
            <div class="col-md-6 mb-4 no-print">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white font-weight-bold">
                        <i class="icon ion-md-create me-1"></i> Remplissez vos informations
                    </div>
                    <div class="card-body">
                        <form id="formCarte">
                            <div class="row g-2">
                                <div class="col-md-4">
                                    <label class="form-label font-weight-bold">Nom</label>
                                    <input type="text" id="inNom" class="form-control form-control-sm" placeholder="Ex: TSHIBANGU" oninput="mettreAJourCarte()" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label font-weight-bold">Postnom</label>
                                    <input type="text" id="inPostnom" class="form-control form-control-sm" placeholder="Ex: KALOMBO" oninput="mettreAJourCarte()">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label font-weight-bold">Prénom</label>
                                    <input type="text" id="inPrenom" class="form-control form-control-sm" placeholder="Ex: Mike" oninput="mettreAJourCarte()" required>
                                </div>

                                <div class="col-md-6 mt-2">
                                    <label class="form-label font-weight-bold">Fonction / Qualité</label>
                                    <input type="text" id="inFonction" class="form-control form-control-sm" placeholder="Ex: Président / Membre" oninput="mettreAJourCarte()">
                                </div>
                                <div class="col-md-6 mt-2">
                                    <label class="form-label font-weight-bold">Téléphone</label>
                                    <input type="text" id="inTel" class="form-control form-control-sm" placeholder="+243 ..." oninput="mettreAJourCarte()">
                                </div>

                                <div class="col-md-6 mt-2">
                                    <label class="form-label font-weight-bold">E-mail</label>
                                    <input type="email" id="inEmail" class="form-control form-control-sm" placeholder="exemple@gmail.com" oninput="mettreAJourCarte()">
                                </div>
                                <div class="col-md-6 mt-2">
                                    <label class="form-label font-weight-bold">Adresse</label>
                                    <input type="text" id="inAdresse" class="form-control form-control-sm" placeholder="Commune, Ville" oninput="mettreAJourCarte()">
                                </div>

                                <div class="col-12 mt-3">
                                    <label class="form-label font-weight-bold">Photo de Profil (Format d'identité)</label>
                                    <input type="file" id="inPhoto" class="form-control form-control-sm" accept="image/*" onchange="chargerPhoto(event)">
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- APERÇU EN TEMPS RÉEL DE LA CARTE DE MEMBRE (9cm x 6cm) -->
            <div class="col-md-6 text-center">
                <h6 class="font-weight-bold text-secondary mb-3 no-print">Aperçu en temps réel de votre carte (9cm x 6cm)</h6>
                
                <!-- RENDU DE LA CARTE -->
                <div id="zoneCarteImpression" class="carte-container">
                    
                    <!-- Logo JSD en haut à gauche -->
                    <img src="img/logo.jpg" alt="Logo" class="carte-logo" onerror="this.src='https://via.placeholder.com/50?text=JSD'">

                    <!-- En-tête centré -->
                    <div class="carte-header">
                        <h6>République Démocratique du Congo</h6>
                        <h5>Jeunesse Sociale pour le Développement</h5>
                        <p>(JSD)</p>
                    </div>

                    <!-- Corps de la carte -->
                    <div class="carte-body">
                        
                        <!-- Informations du membre à gauche -->
                        <div class="carte-infos">
                            <div><strong>Nom :</strong> <span id="outNom">...</span></div>
                            <div><strong>Postnom :</strong> <span id="outPostnom">...</span></div>
                            <div><strong>Prénom :</strong> <span id="outPrenom">...</span></div>
                            <div><strong>Fonction :</strong> <span id="outFonction">...</span></div>
                            <div><strong>Adresse :</strong> <span id="outAdresse">...</span></div>
                            <div><strong>Tél :</strong> <span id="outTel">...</span></div>
                            <div><strong>E-mail :</strong> <span id="outEmail">...</span></div>
                        </div>

                        <!-- Zone de droite (Photo + Code QR) -->
                        <div class="carte-droite">
                            <!-- Photo du membre en haut à droite -->
                            <img id="outPhoto" src="https://via.placeholder.com/100x120?text=PHOTO" alt="Photo" class="carte-photo">
                            
                            <!-- QR Code généré en bas à droite -->
                            <div id="qrcode"></div>
                        </div>

                    </div>
                </div>

                <!-- BOUTONS D'ACTION ET DE SÉCURITÉ -->
                <div class="mt-4 no-print d-flex justify-content-center gap-2">
                    
                    <!-- Téléchargement JPG accessible au membre -->
                    <button type="button" class="btn btn-success me-2 fw-bold" onclick="telechargerCarteJPG()">
                        <i class="icon ion-md-download me-1"></i> Télécharger en JPG
                    </button>

                    <!-- Impression restreinte exclusivement au Président -->
                    <button type="button" class="btn btn-dark fw-bold" onclick="imprimerCarteSecurisee()">
                        <i class="icon ion-md-print me-1"></i> Imprimer (Réservé au Président)
                    </button>

                </div>

            </div>

        </div>
    </div>

    <!-- SCRIPTS JAVASCRIPT POUR LA DYNAMIQUE DE LA CARTE -->
    <script>
        const CODE_SECRET_PRESIDENT = "ann@s0852";
        let qrcodeObj = null;

        // Initialisation au chargement de la page
        document.addEventListener("DOMContentLoaded", () => {
            qrcodeObj = new QRCode(document.getElementById("qrcode"), {
                width: 55,
                height: 55,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
            mettreAJourCarte();
        });

        // Mise à jour en temps réel des champs sur la carte
        function mettreAJourCarte() {
            const nom = document.getElementById("inNom").value.trim() || "...";
            const postnom = document.getElementById("inPostnom").value.trim() || "...";
            const prenom = document.getElementById("inPrenom").value.trim() || "...";
            const fonction = document.getElementById("inFonction").value.trim() || "...";
            const adresse = document.getElementById("inAdresse").value.trim() || "...";
            const tel = document.getElementById("inTel").value.trim() || "...";
            const email = document.getElementById("inEmail").value.trim() || "...";

            document.getElementById("outNom").innerText = nom;
            document.getElementById("outPostnom").innerText = postnom;
            document.getElementById("outPrenom").innerText = prenom;
            document.getElementById("outFonction").innerText = fonction;
            document.getElementById("outAdresse").innerText = adresse;
            document.getElementById("outTel").innerText = tel;
            document.getElementById("outEmail").innerText = email;

            // Contenu dynamique du QR Code
            const qrTexte = `JSD-CARTE\nNom: ${nom}\nPrénom: ${prenom}\nFonction: ${fonction}\nTel: ${tel}`;
            qrcodeObj.clear();
            qrcodeObj.makeCode(qrTexte);
        }

        // Chargement de la photo envoyée par le membre
        function chargerPhoto(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('outPhoto');
                output.src = reader.result;
            };
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        // 4. Génération et téléchargement en image JPG
        function telechargerCarteJPG() {
            const zoneCarte = document.getElementById("zoneCarteImpression");
            
            html2canvas(zoneCarte, {
                scale: 3, // Haute résolution JPG
                useCORS: true,
                logging: false,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const link = document.createElement('a');
                const nomFichier = (document.getElementById("inNom").value.trim() || "Membre") + "_JSD.jpg";
                link.download = nomFichier;
                link.href = canvas.toDataURL("image/jpeg", 0.95);
                link.click();
            });
        }

        // 5. Impression sécurisée (Seul le Président a l'accès)
        function imprimerCarteSecurisee() {
            const codeSaisi = prompt("ACCÈS RESTREINT (Président uniquement) :\nVeuillez saisir le code secret du Président pour imprimer cette carte :");

            if (codeSaisi && codeSaisi.trim() === CODE_SECRET_PRESIDENT) {
                const carte = document.getElementById("zoneCarteImpression");
                carte.classList.add("is-printing-carte");
                
                setTimeout(() => {
                    window.print();
                    carte.classList.remove("is-printing-carte");
                }, 300);
            } else if (codeSaisi !== null) {
                alert("Accès refusé ! Vous n'avez pas l'autorisation d'imprimer la carte.");
            }
        }
    </script>
</body>
</html>
