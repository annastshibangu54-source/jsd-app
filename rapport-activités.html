<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapports d'Activités - JSD RDC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <!-- En-tête / Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="index.html">JSD RDC</a>
            <div>
                <a href="don-adhesion.html" class="btn btn-warning btn-sm fw-bold me-1">Adhésion</a>
                <a href="suivi-adhesion.html" class="btn btn-outline-info btn-sm">Suivi</a>
            </div>
        </div>
    </nav>

    <!-- Header Section -->
    <div class="bg-primary text-white py-4 mb-4">
        <div class="container text-center">
            <h2 class="fw-bold"><i class="bi bi-file-earmark-text-fill me-2"></i>Rapports d'Activités</h2>
            <p class="lead mb-0 fs-6">Transparence et suivi des réalisations de la Jeunesse Sociale pour le Développement (JSD)</p>
        </div>
    </div>

    <!-- Contenu des rapports -->
    <div class="container my-5">
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Chargement des rapports...</p>
        </div>

        <div id="rapportsList" class="row g-4"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlGswEPk6CM4AO7SeqmZeuaFxUWMRlESI",
            authDomain: "jeunesse-social-pour-le-dvelop.firebaseapp.com",
            projectId: "jeunesse-social-pour-le-dvelop",
            storageBucket: "jeunesse-social-pour-le-dvelop.firebasestorage.app",
            messagingSenderId: "728224479628",
            appId: "1:728224479628:web:c43406a998d184d3a63ea9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function chargerRapports() {
            const container = document.getElementById('rapportsList');
            const loading = document.getElementById('loading');

            try {
                const q = query(collection(db, "rapports"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);

                loading.classList.add('d-none');

                if (querySnapshot.empty) {
                    container.innerHTML = `<div class="col-12 text-center text-muted py-5">
                        <i class="bi bi-folder-x fs-1 d-block mb-2 text-secondary"></i>
                        Aucun rapport d'activité publié pour le moment.
                    </div>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();

                    const col = document.createElement('div');
                    col.className = 'col-md-6 col-lg-4';
                    col.innerHTML = `
                        <div class="card shadow-sm border-0 h-100">
                            <div class="card-body d-flex flex-column">
                                <div class="d-flex align-items-center mb-2">
                                    <span class="badge bg-primary me-2"><i class="bi bi-calendar-event me-1"></i>${data.periode || 'Période N/A'}</span>
                                </div>
                                <h5 class="card-title fw-bold text-dark">${data.titre}</h5>
                                <p class="card-text text-muted small flex-grow-1">${data.description}</p>
                                
                                <div class="mt-3 pt-3 border-top">
                                    ${data.lienDocument ? `
                                        <a href="${data.lienDocument}" target="_blank" class="btn btn-outline-primary btn-sm w-100 fw-bold">
                                            <i class="bi bi-download me-1"></i> Télécharger le PDF / Document
                                        </a>
                                    ` : `
                                        <span class="text-muted small"><i class="bi bi-info-circle me-1"></i> Document non disponible</span>
                                    `}
                                </div>
                            </div>
                        </div>
                    `;
                    container.appendChild(col);
                });
            } catch (err) {
                console.error(err);
                loading.classList.add('d-none');
                container.innerHTML = `<div class="col-12 alert alert-danger">Erreur lors du chargement des rapports.</div>`;
            }
        }

        chargerRapports();
    </script>
</body>
</html>
