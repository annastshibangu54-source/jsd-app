<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devenir Membre ou Faire un Don - JSD RDC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light text-dark">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="index.html">JSD RDC</a>
            <a href="suivi-adhesion.html" class="btn btn-outline-info btn-sm"><i class="bi bi-search me-1"></i> Suivre ma demande</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white pt-4 px-4">
                        <h3 class="fw-bold mb-0"><i class="bi bi-person-plus-fill me-2"></i>Demande d'Adhésion JSD</h3>
                    </div>
                    <div class="card-body px-4 pb-4">
                        <div id="alertMessage" class="d-none alert border-0 mb-3"></div>

                        <form id="formAdhesion">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Nom & Post-nom *</label>
                                    <input type="text" id="nom" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Prénom *</label>
                                    <input type="text" id="prenom" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Téléphone (WhatsApp) *</label>
                                    <input type="tel" id="telephone" class="form-control" placeholder="+243 ..." required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Adresse E-mail</label>
                                    <input type="email" id="email" class="form-control">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Commune / Ville *</label>
                                    <input type="text" id="ville" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold small">Qualité souhaitée *</label>
                                    <select id="statut" class="form-select" required>
                                        <option value="Membre Actif">Membre Actif</option>
                                        <option value="Membre Sympathisant">Membre Sympathisant</option>
                                        <option value="Bénévole / Volontaire">Bénévole / Volontaire</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold small">Motivation</label>
                                    <textarea id="motivation" class="form-control" rows="3"></textarea>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" id="btnSubmit" class="btn btn-warning w-100 fw-bold py-2">
                                        <i class="bi bi-send-fill me-2"></i> Soumettre ma demande
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBlGswEPk6CM4AO7SeqmZeuaFxUWMRlESI",
            authDomain: "jeunesse-social-pour-le-dvelop.firebaseapp.com",
            projectId: "jeunesse-social-pour-le-dvelop",
            storageBucket: "jeunesse-social-pour-le-dvelop.firebasestorage.app",
            messagingSenderId: "728224479628",
            appId: "1:728224479628:web:c43406a998d184d3a63ea9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('formAdhesion').addEventListener('submit', async function(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertMessage');
            
            // Génération d'un code unique à 6 caractères pour le suivi confidentiel
            const codeSuivi = 'JSD-' + Math.random().toString(36).substring(2, 7).toUpperCase();

            try {
                await addDoc(collection(db, "adhesions"), {
                    codeSuivi: codeSuivi,
                    nom: document.getElementById('nom').value.trim(),
                    prenom: document.getElementById('prenom').value.trim(),
                    telephone: document.getElementById('telephone').value.trim(),
                    email: document.getElementById('email').value.trim() || "Non renseigné",
                    ville: document.getElementById('ville').value.trim(),
                    statut: document.getElementById('statut').value,
                    motivation: document.getElementById('motivation').value.trim() || "Aucune",
                    etatDemande: "En attente de traitement",
                    reponsePresident: "",
                    createdAt: serverTimestamp()
                });

                alertBox.className = 'alert alert-success border-0 mb-3';
                alertBox.innerHTML = `
                    <h5 class="fw-bold"><i class="bi bi-check-circle-fill me-2"></i>Demande transmise avec succès !</h5>
                    <p class="mb-1">Conservez votre <strong>Code de suivi confidentiel</strong> pour consulter la réponse du Président :</p>
                    <div class="p-2 bg-white text-dark fw-bold border rounded d-inline-block fs-5 text-primary my-2">${codeSuivi}</div>
                    <p class="mb-0 small"><a href="suivi-adhesion.html?code=${codeSuivi}" class="alert-link">Cliquez ici pour accéder à la page de suivi</a></p>
                `;
                alertBox.classList.remove('d-none');
                document.getElementById('formAdhesion').reset();

            } catch (error) {
                console.error(error);
                alertBox.className = 'alert alert-danger border-0 mb-3';
                alertBox.innerHTML = `Erreur lors de l'envoi de la demande.`;
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
